<!DOCTYPE html>
<html>

    <title>To-Do Form</title>
</head>
<body>

        <label>Item Name:</label>
        <input type="text" name="itemName"><br><br>

        <input type="text" name="itemDescription"><br><br>

        <button type="submit">Submit</button>
    </form>
</body>
</html>
